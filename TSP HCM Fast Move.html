document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"31ba71ed-1b9b-4cf3-aee6-bcdacc5af293\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>\n    html, body { margin: 0; padding: 0; height: 100%; }\n    body { font-family: \"Segoe UI\", ui-sans-serif, system-ui, -apple-system, \"Helvetica Neue\", sans-serif; -webkit-font-smoothing: antialiased; }\n    * { box-sizing: border-box; }\n    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }\n    .anim-fade-in { animation: fadeIn 0.3s ease both; }\n    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n    .anim-fade-up { animation: fadeUp 0.45s cubic-bezier(0.32,0.72,0,1) both; }\n    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }\n    .anim-toast { animation: toastIn 0.25s cubic-bezier(0.32,0.72,0,1) both; }\n    a { color: #1a4f8a; }\n    a:hover { color: #1e5ea3; }\n  <\u002Fstyle>\n  <script src=\"df4e39eb-616c-466c-97b9-937915423677\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"height:100vh; overflow:hidden; font-size:14px; line-height:1.5;\">\n\n<!-- ============================================================ -->\n<!-- ==================  TSP AI HUB (default shell)  ============ -->\n<!-- ============================================================ -->\n<sc-if value=\"{{ isHub }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex; height:100%; overflow:hidden; background:#f4f7fb; color:#1a2533;\">\n\n  <aside style=\"{{ sidebarStyle }}\">\n    <button onclick=\"{{ goHome }}\" style=\"padding:15px 16px 14px; border-bottom:1px solid #dde5ef; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:none; background:none; cursor:pointer; width:100%;\" title=\"TSP AI Hub — Home\">\n      <img src=\"e535160c-99b3-4309-a91b-a22210131fc5\" alt=\"The Silicon Partners\" style=\"height:46px; width:auto; object-fit:contain;\">\n    <\u002Fbutton>\n\n    <nav style=\"flex:1; overflow-y:auto; padding:10px 0 22px;\">\n      <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"13\">\n        <button onclick=\"{{ item.onClick }}\" style=\"{{ item.style }}\" style-hover=\"{color:#1a4f8a; background:#e8f0f9; font-weight:600;}\" title=\"{{ item.label }}\">\n          <span style=\"font-size:15px; flex-shrink:0; width:18px; text-align:center; line-height:1;\">{{ item.icon }}<\u002Fspan>\n          <span style=\"overflow:hidden; text-overflow:ellipsis;\">{{ item.label }}<\u002Fspan>\n          <sc-if value=\"{{ item.isNew }}\">\n            <span style=\"margin-left:auto; font-size:9px; font-weight:800; letter-spacing:.04em; background:#1a4f8a; color:#fff; padding:2px 6px; border-radius:5px;\">NEW<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n  <\u002Faside>\n\n  <div style=\"flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; background:#f4f7fb;\">\n    <header style=\"flex-shrink:0; min-height:56px; padding:0 24px; border-bottom:1px solid #dde5ef; background:#ffffff; display:flex; align-items:center; gap:16px;\">\n      <button onclick=\"{{ toggleSidebar }}\" style=\"flex-shrink:0; background:none; border:none; cursor:pointer; padding:4px; border-radius:6px; color:#8a9ab5; display:grid; place-items:center; font-size:18px;\" title=\"Toggle sidebar\">☰<\u002Fbutton>\n\n      <div style=\"display:flex; align-items:center; gap:9px; font-size:13px; min-width:0; white-space:nowrap;\">\n        <span style=\"color:#8a9ab5; font-weight:600; white-space:nowrap;\">TSP AI Hub<\u002Fspan>\n        <span style=\"color:#cdd8e8;\">/<\u002Fspan>\n        <span style=\"color:#1a4f8a; font-weight:700; display:inline-flex; align-items:center; gap:7px; white-space:nowrap;\">\n          <span style=\"font-size:15px;\">{{ current.icon }}<\u002Fspan>{{ current.label }}\n        <\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"margin-left:auto; display:flex; align-items:center; gap:8px;\">\n        <div style=\"display:flex; gap:2px; padding:3px; background:#eef3fa; border-radius:8px; border:1px solid #dde5ef;\">\n          <sc-for list=\"{{ langItems }}\" as=\"lg\" hint-placeholder-count=\"3\">\n            <button onclick=\"{{ lg.onClick }}\" style=\"{{ lg.style }}\">{{ lg.code }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <main style=\"flex:1; overflow-y:auto;\">\n      <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"anim-fade-in\">\n          <div style=\"background:linear-gradient(135deg, #1a4f8a 0%, #0f2d52 62%, #122438 100%); padding:38px 40px 34px; position:relative; overflow:hidden;\">\n            <div style=\"position:relative; z-index:1; display:flex; align-items:center; gap:24px;\">\n              <div style=\"width:62px; height:62px; flex-shrink:0; background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.22); border-radius:16px; display:grid; place-items:center; font-size:28px; color:#fff;\">✦<\u002Fdiv>\n              <div style=\"flex:1; min-width:0;\">\n                <div style=\"font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.55); margin-bottom:7px;\">TSP AI Hub · Powered by TSP Aria<\u002Fdiv>\n                <div style=\"font-size:26px; font-weight:800; color:#fff; line-height:1.12; letter-spacing:-.4px; margin-bottom:9px;\">Your AI-Powered SAP Delivery Platform<\u002Fdiv>\n                <div style=\"font-size:13.5px; color:rgba(255,255,255,.74); line-height:1.55; max-width:600px;\">\n                  TSP's AI knowledgebase, intelligent agents and AI-assisted project delivery with <strong style=\"color:#fff; font-weight:600;\">TSP Aria<\u002Fstrong> — combining deep SAP expertise with intelligent automation to accelerate every stage of your engagement.\n                <\u002Fdiv>\n                <div style=\"display:flex; gap:9px; margin-top:20px; flex-wrap:wrap;\">\n                  <span style=\"display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:20px; padding:5px 13px 5px 9px; font-size:11.5px; font-weight:600; color:rgba(255,255,255,.92);\"><span style=\"width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.5);\"><\u002Fspan>AI Knowledgebase<\u002Fspan>\n                  <span style=\"display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:20px; padding:5px 13px 5px 9px; font-size:11.5px; font-weight:600; color:rgba(255,255,255,.92);\"><span style=\"width:8px; height:8px; border-radius:50%; background:#4caf50;\"><\u002Fspan>Intelligent Agents<\u002Fspan>\n                  <span style=\"display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:20px; padding:5px 13px 5px 9px; font-size:11.5px; font-weight:600; color:rgba(255,255,255,.92);\"><span style=\"width:8px; height:8px; border-radius:50%; background:#ffb74d;\"><\u002Fspan>AI-Assisted Delivery<\u002Fspan>\n                  <span style=\"display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:20px; padding:5px 13px 5px 9px; font-size:11.5px; font-weight:600; color:rgba(255,255,255,.92);\"><span style=\"width:8px; height:8px; border-radius:50%; background:#64b5f6;\"><\u002Fspan>TSP Aria<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:28px 32px 48px;\">\n            <div style=\"font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#8a9ab5; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid #dde5ef;\">Quick Access — All Workspaces<\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fill, minmax(208px, 1fr)); gap:13px;\">\n              <sc-for list=\"{{ tiles }}\" as=\"tile\" hint-placeholder-count=\"12\">\n                <button onclick=\"{{ tile.onClick }}\" style=\"{{ tile.cardStyle }}\">\n                  <span style=\"position:absolute; top:14px; right:13px; font-size:13px; color:#cdd8e8;\">↗<\u002Fspan>\n                  <span style=\"font-size:22px; margin-bottom:5px; line-height:1;\">{{ tile.icon }}<\u002Fspan>\n                  <span style=\"font-size:13.5px; font-weight:700; color:{{ tile.nameColor }}; line-height:1.25;\">{{ tile.label }}<\u002Fspan>\n                  <span style=\"font-size:11.5px; color:#8a9ab5;\">{{ tile.desc }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isPlaceholder }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"anim-fade-in\" style=\"display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:60px 32px; text-align:center; min-height:60vh;\">\n          <div style=\"width:92px; height:92px; border-radius:24px; display:grid; place-items:center; font-size:44px; background:#e8f0f9; border:1px solid #dde5ef;\">{{ current.icon }}<\u002Fdiv>\n          <h2 style=\"font-size:21px; color:#1a4f8a; margin:0; font-weight:700;\">{{ current.label }}<\u002Fh2>\n          <p style=\"font-size:13.5px; color:#8a9ab5; max-width:420px; line-height:1.6; margin:0;\">{{ current.blurb }}<\u002Fp>\n          <span style=\"font-size:11px; font-weight:700; letter-spacing:.04em; color:#56657f; background:#eef3fa; border:1px solid #dde5ef; border-radius:99px; padding:5px 13px;\">{{ current.badge }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u00 SECTIONS = [\n  { id: \"home\",          icon: \"🏠\", label: \"Home\",          desc: \"Platform overview\" },\n  { id: \"ai-assistant\",  icon: \"🤖\", label: \"TSP Atom\",       desc: \"Chat, Cowork & AI tasks\" },\n  { id: \"app-orchid\",    icon: \"🟣\", label: \"App Orchid\",     desc: \"Integrated apps\" },\n  { id: \"admin\",         icon: \"🔒\", label: \"Admin\",          desc: \"Settings & control\" },\n  { id: \"assessments\",   icon: \"🔬\", label: \"Assessments\",    desc: \"AI-driven discovery\" },\n  { id: \"client-portal\", icon: \"🌐\", label: \"Client Portal\",  desc: \"Full project lifecycle\" },\n  { id: \"pre-sales\",     icon: \"📤\", label: \"Pre-Sales\",      desc: \"Pipeline & proposals\" },\n  { id: \"operations\",    icon: \"⚙️\", label: \"Operations\",     desc: \"Platform ops\" },\n  { id: \"project-setup\", icon: \"🗂️\", label: \"Project Set-up\", desc: \"Configuration & onboarding\" },\n  { id: \"tsp-aria\",      icon: \"✨\", label: \"TSP Aria\",       desc: \"AI delivery layer\" },\n  { id: \"workforce\",     icon: \"👥\", label: \"Workforce\",      desc: \"Team management\" },\n  { id: \"fast-move\",     icon: \"🚀\", label: \"HCM Fast Move\",  desc: \"New application\", isNew: true },\n];\n\nconst BLURBS = {};\nconst DEFAULT_BLURB = \"This workspace is part of the full TSP AI Hub.\";\n\nconst FM_ORCHESTRATOR = [\n  { id: \"roadmap\",   icon: \"🧭\" },\n  { id: \"all-tasks\", icon: \"✅\" },\n  { id: \"error-log\", icon: \"🚨\" },\n];\nconst FM_COCKPIT = [\n  { id: \"home-dashboard\",      icon: \"🏠\" },\n  { id: \"data-readiness\",      icon: \"📋\" },\n  { id: \"job-architecture\",    icon: \"🏗️\" },\n  { id: \"payroll-comp\",        icon: \"💰\" },\n  { id: \"time-work-schedule\",  icon: \"⏱️\" },\n  { id: \"employee-data\",       icon: \"👤\" },\n  { id: \"historical-data\",     icon: \"🗄️\" },\n  { id: \"custom-code\",         icon: \"💻\" },\n  { id: \"security-rbp\",        icon: \"🛡️\" },\n  { id: \"spinifex-integration\",icon: \"🔌\" },\n  { id: \"insights-reports\",    icon: \"📊\" },\n];\nconst FM_ITEM_LABELS = {\n  en: { roadmap: \"Roadmap\", \"all-tasks\": \"All Tasks\", \"error-log\": \"Error Log\",\n    \"home-dashboard\": \"Home Dashboard\", \"data-readiness\": \"Data Readiness\", \"job-architecture\": \"Job Architecture\",\n    \"payroll-comp\": \"Payroll & Comp\", \"time-work-schedule\": \"Time & Work Schedule\", \"employee-data\": \"Employee Data\",\n    \"historical-data\": \"Historical Data\", \"custom-code\": \"Custom Code\", \"security-rbp\": \"Security & RBP\",\n    \"spinifex-integration\": \"Spinifex Integration\", \"insights-reports\": \"Insights & Reports\" },\n  pt: { roadmap: \"Roadmap\", \"all-tasks\": \"Todas as Tarefas\", \"error-log\": \"Log de Erros\",\n    \"home-dashboard\": \"Painel Inicial\", \"data-readiness\": \"Prontidão de Dados\", \"job-architecture\": \"Arquitetura de Cargos\",\n    \"payroll-comp\": \"Folha & Remuneração\", \"time-work-schedule\": \"Tempo & Escalas\", \"employee-data\": \"Dados de Funcionários\",\n    \"historical-data\": \"Dados Históricos\", \"custom-code\": \"Código Customizado\", \"security-rbp\": \"Segurança & RBP\",\n    \"spinifex-integration\": \"Integração Spinifex\", \"insights-reports\": \"Insights & Relatórios\" },\n  es: { roadmap: \"Roadmap\", \"all-tasks\": \"Todas las Tareas\", \"error-log\": \"Registro de Errores\",\n    \"home-dashboard\": \"Panel Principal\", \"data-readiness\": \"Preparación de Datos\", \"job-architecture\": \"Arquitectura de Puestos\",\n    \"payroll-comp\": \"Nómina & Compensación\", \"time-work-schedule\": \"Tiempo & Horarios\", \"employee-data\": \"Datos de Empleados\",\n    \"historical-data\": \"Datos Históricos\", \"custom-code\": \"Código Personalizado\", \"security-rbp\": \"Seguridad & RBP\",\n    \"spinifex-integration\": \"Integración Spinifex\", \"insights-reports\": \"Insights & Informes\" },\n};\n\nlet fmIdCounter = 1;\n\nconst FM_PROJECTS = [\n  { id: \"PRJ-2026-087\", name: \"SAP Payroll Migration\" },\n  { id: \"PRJ-2026-045\", name: \"Workday to SF Migration\" },\n  { id: \"PRJ-2025-198\", name: \"S/4HANA Rollout — LATAM\" },\n];\n\nclass Component extends DCLogic {\n  state = {\n    section: \"home\",\n    sidebarCollapsed: false,\n    lang: \"en\",\n    platform: null,\n\n    fmSection: \"roadmap\",\n    fmSidebarCollapsed: false,\n    fmRoadmapPanelOpen: true,\n    fmProductsPanelOpen: false,\n    fmTaskSearch: \"\",\n    fmTaskStatusFilter: \"\",\n    fmTaskPageSize: 10,\n    selectedTaskIds: [],\n    taskComments: {},\n    commentModalOpen: false,\n    commentTaskId: null,\n    commentDraft: \"\",\n    commentAdding: false,\n    commentPopoverPos: { top: 0, left: 0 },\n    bulkForm: { status: \"\", progress: \"\", comment: \"\" },\n    bulkModalOpen: false,\n    fmLang: \"en\",\n    fmRole: \"pm\",\n    fmProjectId: \"PRJ-2026-087\",\n    migrationType: \"ecc-ecp-spinifex\",\n    activePhaseId: \"project-setup\",\n    taskOverrides: {},\n    extraTasks: [],\n\n    modalOpen: false,\n    modalMode: \"edit\",\n    modalTaskId: null,\n    modalForm: { status: \"pending\", progress: 0, owner: \"pmo\", startWk: 1, endWk: 1, desc: \"\", showstopper: \"no\" },\n\n    fmToast: \"\",\n    fmBurnUnit: \"hours\",\n    fmBurndownUnit: \"hours\",\n    fmLastSyncTs: Date.now(),\n  };\n\n  showFmToast(msg) {\n    this.setState({ fmToast: msg });\n    clearTimeout(this._fmToastTimer);\n    this._fmToastTimer = setTimeout(() => this.setState({ fmToast: \"\" }), 2400);\n  }\n\n  goSection(id) {\n    if (id === \"fast-move\") { this.setState({ platform: \"fast-move\" }); return; }\n    this.setState({ platform: null, section: id });\n  }\n  backToHub() { this.setState({ platform: null, section: \"home\" }); }\n  fmGoTo(id) { this.setState({ fmSection: id }); }\n  setPhase(id) { this.setState({ activePhaseId: id }); }\n  setMigrationType(id) { this.setState({ migrationType: id }); }\n  fmBack() { this.fmGoTo(\"home-dashboard\"); }\n  fmSyncNow() {\n    this.setState({ fmLastSyncTs: Date.now() });\n    this.showFmToast(this.state.fmLang === \"pt\" ? \"Sincronizado\" : this.state.fmLang === \"es\" ? \"Sincronizado\" : \"Synced\");\n  }\n  fmViewFullPlan() { this.fmGoTo(\"all-tasks\"); }\n  selectFmProject(id) {\n    if (id === this.state.fmProjectId) return;\n    if (id !== \"PRJ-2026-087\") {\n      this.showFmToast(this.state.fmLang === \"pt\" ? \"Este projeto ainda não tem um roadmap\" : this.state.fmLang === \"es\" ? \"Este proyecto aún no tiene un roadmap\" : \"This project doesn't have a roadmap yet\");\n      return;\n    }\n    this.setState({ fmProjectId: id });\n  }\n\n  openUpdateModal(task) {\n    this.setState({\n      modalOpen: true, modalMode: \"edit\", modalTaskId: task.id,\n      modalForm: { status: task.status, progress: task.progress, owner: task.owner, startWk: task.startWk, endWk: task.endWk, desc: \"\" },\n    });\n  }\n  openAddModal() {\n    this.setState({\n      modalOpen: true, modalMode: \"add\", modalTaskId: null,\n      modalForm: { status: \"pending\", progress: 0, owner: \"pmo\", startWk: 1, endWk: 1, desc: \"\", showstopper: \"no\" },\n    });\n  }\n  closeModal() { this.setState({ modalOpen: false }); }\n  setModalField(field, value) { this.setState((s) => ({ modalForm: { ...s.modalForm, [field]: value } })); }\n\n  toggleTaskSelect(id) {\n    this.setState((s) => ({ selectedTaskIds: s.selectedTaskIds.includes(id) ? s.selectedTaskIds.filter((x) => x !== id) : [...s.selectedTaskIds, id] }));\n  }\n  toggleSelectAll(ids) {\n    this.setState((s) => ({ selectedTaskIds: s.selectedTaskIds.length === ids.length ? [] : ids.slice() }));\n  }\n  clearSelection() { this.setState({ selectedTaskIds: [], bulkForm: { status: \"\", progress: \"\", comment: \"\" } }); }\n  setBulkField(field, value) { this.setState((s) => ({ bulkForm: { ...s.bulkForm, [field]: value } })); }\n  openBulkModal() { this.setState({ bulkModalOpen: true }); }\n  closeBulkModal() { this.setState({ bulkModalOpen: false }); }\n  applyBulkUpdate() {\n    const { selectedTaskIds, bulkForm, taskOverrides, taskComments } = this.state;\n    if (!selectedTaskIds.length) return;\n    const nextOverrides = { ...taskOverrides };\n    const nextComments = { ...taskComments };\n    selectedTaskIds.forEach((id) => {\n      const patch = {};\n      if (bulkForm.status) patch.status = bulkForm.status;\n      if (bulkForm.progress !== \"\") patch.progress = Number(bulkForm.progress);\n      if (Object.keys(patch).length) nextOverrides[id] = { ...(nextOverrides[id] || {}), ...patch };\n      if (bulkForm.comment) nextComments[id] = [...(nextComments[id] || []), { text: bulkForm.comment, ts: Date.now() }];\n    });\n    this.setState({ taskOverrides: nextOverrides, taskComments: nextComments, selectedTaskIds: [], bulkForm: { status: \"\", progress: \"\", comment: \"\" }, bulkModalOpen: false });\n    this.showFmToast(this.state.fmLang === \"pt\" ? \"Tarefas atualizadas\" : this.state.fmLang === \"es\" ? \"Tareas actualizadas\" : \"Tasks updated\");\n  }\n\n  openCommentModal(id, evt) {\n    const r = evt && evt.currentTarget ? evt.currentTarget.getBoundingClientRect() : { top: 100, left: 100, bottom: 120 };\n    let left = r.left - 190;\n    if (left < 8) left = r.left;\n    let top = r.bottom + 8;\n    if (top + 260 > window.innerHeight) top = Math.max(8, r.top - 260);\n    this.setState({ commentModalOpen: true, commentTaskId: id, commentDraft: \"\", commentAdding: false, commentPopoverPos: { top, left } });\n  }\n  closeCommentModal() { this.setState({ commentModalOpen: false, commentAdding: false }); }\n  setCommentDraft(v) { this.setState({ commentDraft: v }); }\n  startAddComment() { this.setState({ commentAdding: true }); }\n  cancelAddComment() { this.setState({ commentAdding: false, commentDraft: \"\" }); }\n  saveComment() {\n    const { commentTaskId, commentDraft } = this.state;\n    if (!commentDraft.trim()) { this.setState({ commentAdding: false }); return; }\n    this.setState((s) => ({\n      taskComments: { ...s.taskComments, [commentTaskId]: [...(s.taskComments[commentTaskId] || []), { text: commentDraft, ts: Date.now() }] },\n      commentAdding: false, commentDraft: \"\",\n    }));\n    this.showFmToast(this.state.fmLang === \"pt\" ? \"Comentário salvo\" : this.state.fmLang === \"es\" ? \"Comentario guardado\" : \"Comment saved\");\n  }\n  setTaskProgress(id, value) {\n    const n = Number(value);\n    const status = n === 100 ? \"done\" : n === 0 ? \"pending\" : \"in_progress\";\n    this.setState((s) => ({ taskOverrides: { ...s.taskOverrides, [id]: { ...(s.taskOverrides[id] || {}), progress: n, status } } }));\n  }\n  setTaskStatus(id, value) {\n    this.setState((s) => ({ taskOverrides: { ...s.taskOverrides, [id]: { ...(s.taskOverrides[id] || {}), status: value } } }));\n  }\n  loadMoreTasks() { this.setState((s) => ({ fmTaskPageSize: s.fmTaskPageSize + 10 })); }\n\n  saveModal() {\n    const { modalMode, modalTaskId, modalForm, activePhaseId } = this.state;\n    if (modalMode === \"edit\") {\n      this.setState((s) => ({\n        taskOverrides: { ...s.taskOverrides, [modalTaskId]: {\n          status: modalForm.status, progress: Number(modalForm.progress) || 0,\n          owner: modalForm.owner, startWk: Number(modalForm.startWk) || 1, endWk: Number(modalForm.endWk) || 1,\n        } },\n        modalOpen: false,\n      }));\n      this.showFmToast(this.state.fmLang === \"pt\" ? \"Tarefa atualizada\" : this.state.fmLang === \"es\" ? \"Tarea actualizada\" : \"Task updated\");\n    } else {\n      const phase = window.FASTMOVE_DATA.PHASES.find((p) => p.id === activePhaseId);\n      const id = phase.code + \"-N\" + (fmIdCounter++);\n      const newTask = {\n        id, phase: activePhaseId, owner: modalForm.owner, status: modalForm.status,\n        progress: Number(modalForm.progress) || 0, startWk: Number(modalForm.startWk) || 1, endWk: Number(modalForm.endWk) || 1,\n        showstopper: modalForm.showstopper === \"yes\", desc: { en: modalForm.desc, pt: modalForm.desc, es: modalForm.desc },\n      };\n      this.setState((s) => ({ extraTasks: [...s.extraTasks, newTask], modalOpen: false }));\n      this.showFmToast(this.state.fmLang === \"pt\" ? \"Tarefa adicionada\" : this.state.fmLang === \"es\" ? \"Tarea agregada\" : \"Task added\");\n    }\n  }\n\n  renderVals() {\n    const D = window.FASTMOVE_DATA;\n    const { section, sidebarCollapsed, lang, platform } = this.state;\n    const { fmSection, fmSidebarCollapsed, fmRoadmapPanelOpen, fmProductsPanelOpen, fmTaskSearch, fmTaskStatusFilter, fmTaskPageSize, selectedTaskIds, taskComments, commentModalOpen, commentDraft, commentAdding, commentPopoverPos, commentTaskId, bulkForm, bulkModalOpen, fmLang, fmRole, fmProjectId, migrationType, activePhaseId, taskOverrides, extraTasks, modalOpen, modalMode, modalForm, fmToast, fmBurnUnit, fmBurndownUnit, fmLastSyncTs } = this.state;\n\n    const current = SECTIONS.find((s) => s.id === section) || SECTIONS[0];\n\n    const navItems = SECTIONS.map((s) => {\n      const active = s.id === section && !platform;\n      return {\n        id: s.id, icon: s.icon, label: s.label, isNew: !!s.isNew,\n        onClick: () => this.goSection(s.id),\n        style: {\n          display: \"flex\", alignItems: \"center\", gap: 10, padding: \"9px 16px\", fontSize: 13,\n          color: active ? \"#1a4f8a\" : \"#56657f\", cursor: \"pointer\", border: \"none\",\n          borderLeft: active ? \"3px solid #1a4f8a\" : \"3px solid transparent\",\n          background: active ? \"#e8f0f9\" : \"none\", fontWeight: active ? 700 : 500,\n          width: \"100%\", textAlign: \"left\", whiteSpace: \"nowrap\",\n        },\n      };\n    });\n\n    const tiles = SECTIONS.filter((s) => s.id !== \"home\").map((s) => ({\n      id: s.id, icon: s.icon, label: s.label, desc: s.desc, nameColor: \"#1a2533\",\n      onClick: () => this.goSection(s.id),\n      cardStyle: {\n        background: \"#ffffff\", border: \"1px solid #dde5ef\", borderTop: \"3px solid #1a4f8a\",
